name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the leak guard can check every commit message and author.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Corepack installs the exact pnpm version pinned in package.json ("packageManager").
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
